x-qdrant: &qdrant-base
  image: qdrant/qdrant:latest
  restart: unless-stopped

x-postgres: &postgres-base
  image: postgres:15
  restart: unless-stopped
  environment:
    POSTGRES_DB: topix
    POSTGRES_USER: topix
    POSTGRES_HOST_AUTH_METHOD: trust

x-redis: &redis-base
  image: redis:7-alpine
  restart: unless-stopped
  command: redis-server --appendonly yes

services:
  qdrant:
    <<: *qdrant-base
    container_name: qdrant
    ports:
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    <<: *postgres-base
    container_name: postgres
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "topix"]
      interval: 5s
      timeout: 2s
      retries: 10

  redis:
    <<: *redis-base
    container_name: redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  backend:
    image: winlp4ever/dim0-backend:${DIM0_VERSION:?DIM0_VERSION is required}
    container_name: dim0-backend
    volumes:
      - ../${ENVFILE:-.env}:/.env:ro
      - backend_data:/app/data
    environment:
      DOPPLER_TOKEN: ${DOPPLER_TOKEN}
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-8081}
      QDRANT_HOST: ${QDRANT_HOST:-qdrant}
      QDRANT_PORT: ${QDRANT_PORT:-6333}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    command: ["python", "-m", "topix.api.app", "--stage", "prod"]
    depends_on:
      - postgres
      - qdrant
      - redis
    ports:
      - "${API_PORT:-8081}:${API_PORT:-8081}"

  webui:
    image: winlp4ever/dim0-webui:${DIM0_VERSION:?DIM0_VERSION is required}
    container_name: dim0-webui
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:${API_PORT:-8888}}
      VITE_BILLING_ENABLED: ${VITE_BILLING_ENABLED:-false}
      # Mini-app sandboxed iframe runtime — see mini-app-archi.md §6.1.
      # In prod set these to https://mini-app.dim0.net and
      # https://dim0.net via the deploy-time .env override.
      VITE_MINI_APP_ORIGIN: ${VITE_MINI_APP_ORIGIN:-http://localhost:${MINI_APP_PORT:-5001}}
      VITE_HOST_ORIGIN: ${VITE_HOST_ORIGIN:-http://localhost:${APP_PORT:-3000}}
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-3000}:80"
      - "${MINI_APP_PORT:-5001}:5001"

volumes:
  qdrant_data:
  pg_data:
  redis_data:
  backend_data:
