# nginx site for dim0 (single-origin, HTTP — add HTTPS via certbot once you
# have a domain; see README.md "Add HTTPS later").
#
# setup.sh substitutes __BACKEND_PORT__ and installs this to
# /etc/nginx/sites-available/dim0 (symlinked into sites-enabled).
#
# The backend (uvicorn on 127.0.0.1:__BACKEND_PORT__) serves the built webui
# dist via DIM0_WEBUI_DIST, so this config only handles:
#   - default proxy (API + static SPA + launcher.html + canvas)
#   - WebSocket upgrade for the collab canvas  (/boards/{id}/collab)
#   - unbuffered streaming for research SSE    (/integration/research/*)

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Default: proxy everything to the backend (which also serves the built
    # webui dist via DIM0_WEBUI_DIST — launcher.html, canvas SPA, /assets).
    location / {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (collab canvas): /boards/{id}/collab — needs HTTP/1.1 + upgrade.
    location /boards/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SSE (research streaming): disable buffering or the client never receives
    # incremental events. Research runs minutes-long (claude CLI subprocess).
    location /integration/research/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}